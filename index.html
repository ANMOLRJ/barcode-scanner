<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Smart Barcode Scanner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;padding:16px}.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 7px 25px rgba(20,30,50,.08)}
h1{font-size:25px;margin:5px 0}.sub,.muted{color:#697386}.btn{width:100%;padding:14px;border-radius:13px;border:1px solid #dce1e9;background:#fff;font-size:16px;font-weight:750;cursor:pointer}.primary{background:#172033;color:#fff;border-color:#172033}
.camera{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:#111}.camera video{width:100%;height:100%;object-fit:cover}
.box{position:absolute;left:9%;right:9%;top:32%;height:36%;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.3)}.line{position:absolute;left:10%;right:10%;top:50%;height:2px;background:#fff;animation:scan 1.5s infinite}
@keyframes scan{0%,100%{transform:translateY(-60px)}50%{transform:translateY(60px)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-top:11px}label{font-size:13px;font-weight:750;display:block;margin-bottom:5px}
input{width:100%;padding:12px;border:1px solid #dce1e9;border-radius:12px;font-size:16px}.status{padding:11px;border-radius:12px;background:#eef2f7;margin-top:10px;font-size:14px}.ok{background:#e8f7ed}.bad{background:#fff0f0}
.hidden{display:none!important}.pill{display:inline-block;background:#eef1f6;border-radius:99px;padding:5px 9px;font-size:12px;margin-top:5px}
.item{border-top:1px solid #edf0f4;padding:12px 0}.item:first-child{border-top:0}.price{font-weight:800;font-size:19px}
</style>
</head>
<body>
<div class="app">
<header><h1>📦 Smart Barcode Scanner</h1><div class="sub">Scan → identify → capture MRP/MFD/EXP → save.</div></header>

<section class="card" id="home">
<button class="btn primary" id="scan">📷 Scan Product</button>
<div style="height:9px"></div><button class="btn" id="manual">⌨️ Enter Barcode</button>
</section>

<section class="card hidden" id="scanner">
<div class="camera"><video id="video" autoplay muted playsinline></video><div class="box"></div><div class="line"></div></div>
<p class="muted" style="text-align:center">Point the rear camera at the barcode.</p>
<div class="status" id="cameraStatus">Starting camera…</div>
<div style="height:9px"></div><button class="btn" id="close">Close Camera</button>
</section>

<section class="card hidden" id="manualCard">
<label>Barcode</label><input id="barcodeInput" inputmode="numeric" placeholder="Enter barcode">
<div style="height:10px"></div><button class="btn primary" id="continue">Continue</button>
<div style="height:9px"></div><button class="btn" id="cancel">Cancel</button>
</section>

<section class="card hidden" id="product">
<strong id="lookupTitle">Product Details</strong><div class="pill" id="barcodeLabel"></div>
<div class="field"><label>Product Name</label><input id="name"></div>
<div class="field"><label>Brand</label><input id="brand"></div>
<div class="field"><label>Category</label><input id="category"></div>
<div class="grid">
<div class="field"><label>MRP (₹)</label><input id="mrp" inputmode="decimal" placeholder="e.g. 120"></div>
<div class="field"><label>Selling Price (₹)</label><input id="sellingPrice" inputmode="decimal" placeholder="e.g. 110"></div>
</div>
<div class="grid">
<div class="field"><label>Manufacturing Date</label><input id="mfd" placeholder="MM/YYYY or DD/MM/YYYY"></div>
<div class="field"><label>Expiry Date</label><input id="exp" placeholder="MM/YYYY or DD/MM/YYYY"></div>
</div>
<div class="field"><label>Quantity</label><input id="qty" type="number" min="1" value="1"></div>
<p class="muted" style="font-size:13px">MRP/MFD/EXP are not normally encoded in a standard retail barcode. Enter them from the package; OCR can be added as a later enhancement.</p>
<div style="height:9px"></div><button class="btn primary" id="save">💾 Save to Google Sheet</button>
<div style="height:9px"></div><button class="btn" id="again">📷 Scan Another</button>
<div class="status hidden" id="saveStatus"></div>
</section>

<section class="card"><strong>Recent scans</strong><div id="history" style="margin-top:8px"></div></section>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyWUeyupOAenIkEd8Ym773jmuTxGB2B4HuI5UeI_PlZR08VwOdB6vrpm_bKxc2v77AP/exec";
const home=document.getElementById("home"), scanner=document.getElementById("scanner"), manualCard=document.getElementById("manualCard"), product=document.getElementById("product");
const video=document.getElementById("video"), cameraStatus=document.getElementById("cameraStatus"), historyEl=document.getElementById("history");
let stream=null, detector=null, timer=null, currentBarcode="", source="camera";
let history=JSON.parse(localStorage.getItem("barcodeHistoryV2")||"[]");

function stopCamera(){if(timer)clearInterval(timer);timer=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}
function hideAll(){scanner.classList.add("hidden");manualCard.classList.add("hidden");product.classList.add("hidden")}
async function startCamera(){
 if(!navigator.mediaDevices?.getUserMedia){cameraStatus.textContent="Camera unavailable. Use an HTTPS website.";cameraStatus.className="status bad";return}
 if(!("BarcodeDetector" in window)){cameraStatus.textContent="This browser does not support automatic barcode detection. Use manual entry or a supported Chrome/Edge browser.";cameraStatus.className="status bad";return}
 try{
  detector=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","code_93","itf","codabar","qr_code","data_matrix"]});
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;await video.play();
  cameraStatus.textContent="Camera ready — point at barcode.";cameraStatus.className="status ok";
  timer=setInterval(async()=>{if(!detector||!video.videoWidth)return;try{const c=await detector.detect(video);if(c.length&&c[0].rawValue){currentBarcode=c[0].rawValue;stopCamera();openProduct(currentBarcode,"camera")}}catch(e){}},250);
 }catch(e){cameraStatus.textContent="Camera permission/error: "+e.message;cameraStatus.className="status bad"}
}
async function openProduct(code,src){
 currentBarcode=code;source=src;hideAll();product.classList.remove("hidden");home.classList.add("hidden");
 document.getElementById("barcodeLabel").textContent=code;
 ["name","brand","category","mrp","sellingPrice","mfd","exp"].forEach(id=>document.getElementById(id).value="");
 document.getElementById("qty").value=1;
 await lookup(code);
}
async function lookup(code){
 try{
  const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json");
  if(!r.ok)return;const d=await r.json();if(d.status!==1)return;const p=d.product||{};
  document.getElementById("name").value=p.product_name||"";
  document.getElementById("brand").value=p.brands||"";
  document.getElementById("category").value=(p.categories_tags?.[0]||"").replace(/^en:/,"").replaceAll("-"," ")||p.categories||"";
 }catch(e){}
}
async function save(){
 const st=document.getElementById("saveStatus"),btn=document.getElementById("save");
 const payload={barcode:currentBarcode,name:val("name"),brand:val("brand"),category:val("category"),mrp:val("mrp"),sellingPrice:val("sellingPrice"),manufacturingDate:val("mfd"),expiryDate:val("exp"),quantity:Math.max(1,Number(val("qty")||1)),source};
 btn.disabled=true;btn.textContent="Saving…";
 try{
  await fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  history.unshift({barcode:currentBarcode,name:payload.name,mrp:payload.mrp,mfd:payload.manufacturingDate,exp:payload.exp,time:new Date().toLocaleString()});
  history=history.slice(0,10);localStorage.setItem("barcodeHistoryV2",JSON.stringify(history));render();
  st.textContent="Saved to Google Sheet.";st.className="status ok";st.classList.remove("hidden");
 }catch(e){st.textContent="Could not send to Google Sheet: "+e.message;st.className="status bad";st.classList.remove("hidden")}
 finally{btn.disabled=false;btn.textContent="💾 Save to Google Sheet"}
}
function val(id){return document.getElementById(id).value.trim()}
function render(){historyEl.innerHTML=history.length?history.map(x=>`<div class="item"><strong>${esc(x.name||"Unnamed product")}</strong><div class="muted">${esc(x.barcode)} · ${esc(x.time)}</div><div class="price">${x.mrp?"MRP ₹"+esc(x.mrp):""}</div><div class="muted">${x.mfd?"MFD: "+esc(x.mfd):""}${x.exp?" · EXP: "+esc(x.exp):""}</div></div>`).join(""):'<div class="muted">No scans yet.</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
document.getElementById("scan").onclick=async()=>{home.classList.add("hidden");hideAll();scanner.classList.remove("hidden");await startCamera()}
document.getElementById("close").onclick=()=>{stopCamera();hideAll();home.classList.remove("hidden")}
document.getElementById("manual").onclick=()=>{home.classList.add("hidden");hideAll();manualCard.classList.remove("hidden");document.getElementById("barcodeInput").focus()}
document.getElementById("cancel").onclick=()=>{manualCard.classList.add("hidden");home.classList.remove("hidden")}
document.getElementById("continue").onclick=()=>{const b=val("barcodeInput");if(b)openProduct(b,"manual")}
document.getElementById("barcodeInput").onkeydown=e=>{if(e.key==="Enter")document.getElementById("continue").click()}
document.getElementById("save").onclick=save
document.getElementById("again").onclick=async()=>{product.classList.add("hidden");scanner.classList.remove("hidden");await startCamera()}
addEventListener("beforeunload",stopCamera);render();
</script>
</body>
</html>
